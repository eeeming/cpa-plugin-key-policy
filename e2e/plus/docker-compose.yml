name: cpa-key-quota-plus-e2e

services:
  builder:
    build:
      context: ../..
      dockerfile: e2e/Dockerfile.plugin
    image: local/cpa-key-quota-plugin:plus-e2e
    volumes:
      - plugin_lib:/out

  mock:
    image: python:3.12-alpine
    command: ["python", "/app/mock.py"]
    volumes:
      - ../mock.py:/app/mock.py:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15

  plus:
    image: seakee/cpa-manager-plus:latest
    pull_policy: always
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_ADMIN_KEY: "e2e-admin-key"
      CPA_UPSTREAM_URL: "http://cpa:8317"
      CPA_MANAGEMENT_KEY: "e2e-mgmt-key"
      USAGE_COLLECTOR_MODE: "auto"
    volumes:
      - plus_data:/data
    expose:
      - "18317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  plus-init:
    image: python:3.12-alpine
    depends_on:
      plus:
        condition: service_healthy
    environment:
      PLUS_URL: http://plus:18317
      PLUS_ADMIN_KEY: e2e-admin-key
    volumes:
      - ./seed_plus.py:/app/seed_plus.py:ro
    command: ["python", "/app/seed_plus.py"]

  cpa:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    depends_on:
      mock:
        condition: service_healthy
      plus:
        condition: service_healthy
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config.yaml", "-local-model"]
    volumes:
      - ./cpa-config.yaml:/CLIProxyAPI/config.yaml:ro
      - plugin_lib:/CLIProxyAPI/plugins
      - cpa_data:/CLIProxyAPI/data
      - cpa_auths:/CLIProxyAPI/auths
    expose:
      - "8317"
    ports:
      - "127.0.0.1:18417:8317"

  e2e:
    image: python:3.12-alpine
    depends_on:
      cpa:
        condition: service_started
      plus:
        condition: service_healthy
      mock:
        condition: service_healthy
    environment:
      CPA_URL: http://cpa:8317
      PLUS_URL: http://plus:18317
      MOCK_URL: http://mock:8080
      MGMT_KEY: e2e-mgmt-key
      PLUS_ADMIN_KEY: e2e-admin-key
    volumes:
      - ./e2e.py:/app/e2e.py:ro
    command: ["python", "/app/e2e.py"]

volumes:
  plugin_lib:
  cpa_data:
  cpa_auths:
  plus_data:
