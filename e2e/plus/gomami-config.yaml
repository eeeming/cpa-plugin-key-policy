# Template for the manual gomami tunnel stack. Copy it to config.yaml (the path
# gomami-compose.yml mounts) and fill in the real Plus admin key before use.
host: ""
port: 8317
debug: true
logging-to-file: true
usage-statistics-enabled: true
force-model-prefix: false
request-retry: 0
max-retry-credentials: 1
disable-cooling: true

remote-management:
  allow-remote: true
  secret-key: "e2e-mgmt-key"
  disable-control-panel: true

auth-dir: "/root/.cli-proxy-api"

api-keys:
  - "sk-bound"
  - "sk-unbound"
  - "sk-rpm"
  - "sk-disabled"

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-quota:
      enabled: true
      priority: 10
      state_file: "/CLIProxyAPI/data/cpa-key-quota-state.json"
      plus_base_url: "http://cpa-manager-plus:18317"
      # Must equal CPA_MANAGER_ADMIN_KEY passed to the plus service in
      # gomami-compose.yml, otherwise price/sync calls return 401.
      plus_management_key: "replace-with-manager-plus-admin-key"

openai-compatibility:
  - name: "mock"
    base-url: "http://mock:8080/v1"
    api-key-entries:
      - api-key: "sk-upstream"
    models:
      - name: "gpt-4.1-mini"
        alias: "gpt-4.1-mini"
