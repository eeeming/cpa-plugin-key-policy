services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auth-dir:/root/.cli-proxy-api
      - ./plugins:/CLIProxyAPI/plugins:ro
      - ./data:/CLIProxyAPI/data

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    ports:
      - "127.0.0.1:18317:18317"
    volumes:
      - ./cpa-manager-plus-data:/data
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_ADMIN_KEY: "${CPA_MANAGER_ADMIN_KEY}"
      CPA_UPSTREAM_URL: "http://cli-proxy-api:8317"
      CPA_MANAGEMENT_KEY: "${CPA_MANAGEMENT_KEY}"
      USAGE_COLLECTOR_MODE: "auto"

  # Token-based tunnel: ingress/DNS are dashboard-owned.
  # host network so a dashboard origin of http://localhost:8317 reaches CPA.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
