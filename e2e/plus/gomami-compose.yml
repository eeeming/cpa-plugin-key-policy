services:
  mock:
    image: python:3.12-alpine
    container_name: cpa-mock
    restart: unless-stopped
    command: ["python", "/app/mock.py"]
    volumes:
      - ./mock.py:/app/mock.py:ro

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:18317:18317"
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_ADMIN_KEY: "e2e-admin-key"
      CPA_UPSTREAM_URL: "http://cli-proxy-api:8317"
      CPA_MANAGEMENT_KEY: "e2e-mgmt-key"
      USAGE_COLLECTOR_MODE: "auto"
    volumes:
      - ./plus-data:/data

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - mock
      - cpa-manager-plus
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config.yaml", "-local-model"]
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auth-dir-test:/root/.cli-proxy-api
      - ./plugins:/CLIProxyAPI/plugins:ro
      - ./data:/CLIProxyAPI/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
