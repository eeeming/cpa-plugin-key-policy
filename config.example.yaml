# Example CLIProxyAPI snippet for cpa-key-quota.
# Bind existing Plus api-keys. Do not put plugin-issued keys into api-keys.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-quota:
      enabled: true
      priority: 10
      state_file: "cpa-key-quota-state.json"
      # Plus/Home model-prices (optional). Empty = RPM only, no USD limits.
      plus_base_url: "http://127.0.0.1:8317"
      plus_management_key: "replace-with-management-key"
