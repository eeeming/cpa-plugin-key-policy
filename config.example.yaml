# Example CLIProxyAPI snippet for cpa-key-quota.
# Bind existing Plus api-keys. Do not put plugin-issued keys into api-keys.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-quota:
      enabled: true
      priority: 10
      state_file: "cpa-key-quota-state.json"
      # Price table (optional). Empty URL = RPM only, no USD limits.
      # CPA-Manager-Plus: GET /v0/management/model-prices (Bearer admin key).
      # Home/Plus fallback: GET /v0/management/billing/model-prices.
      plus_base_url: "http://127.0.0.1:18317"
      plus_management_key: "replace-with-manager-plus-admin-key"
